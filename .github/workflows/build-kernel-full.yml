name: build-zorn-kernel-full

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Xiaomi OSS branch
        required: false
        default: bsp-zorn-v-oss

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bc bison flex libssl-dev libelf-dev dwarves cpio rsync kmod xz-utils zstd lz4 python3 make gcc g++ clang-17 lld-17 llvm-17
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-as llvm-dis; do
            src="$t"
            case "$t" in
              clang) src=clang-17 ;;
              clang++) src=clang++-17 ;;
              ld.lld) src=ld.lld-17 ;;
              *) src="${t}-17" ;;
            esac
            sudo ln -sf "$(command -v $src)" /usr/local/bin/$t
          done
          clang --version | head -2
          ld.lld --version
          pahole --version

      - name: Fetch kernel source
        run: |
          BR="${{ github.event.inputs.branch }}"
          curl -fL --retry 5 -o kernel.tar.gz "https://codeload.github.com/MiCode/Xiaomi_Kernel_OpenSource/tar.gz/refs/heads/$BR"
          ls -lh kernel.tar.gz
          mkdir -p src
          tar -xzf kernel.tar.gz -C src --strip-components=1
          rm -f kernel.tar.gz
          head -5 src/Makefile
          du -sh src

      - name: Configure
        run: |
          cd src
          cp $GITHUB_WORKSPACE/config/zorn-full.config .config
          make ARCH=arm64 LLVM=1 olddefconfig > /tmp/olddef.log 2>&1 || { tail -50 /tmp/olddef.log; exit 1; }
          echo "=== key config ==="
          for k in DEVTMPFS CGROUP_PIDS USER_NS SYSVIPC PID_NS MACVLAN IP6_NF_NAT IP6_NF_TARGET_MASQUERADE CFS_BANDWIDTH LOCALVERSION MODVERSIONS CFI_CLANG LTO_CLANG_THIN KASAN DEBUG_INFO_BTF TRIM_UNUSED_KSYMS MODULE_FORCE_LOAD WERROR; do
            grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config || echo "CONFIG_${k}: ABSENT"
          done
          grep -c "" .config

      - name: Build Image
        run: |
          cd $GITHUB_WORKSPACE/src
          set -o pipefail
          time make -j"$(nproc)" ARCH=arm64 LLVM=1 Image 2>&1 | tee /tmp/build.log | tail -40
          ls -lh arch/arm64/boot/Image
          cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image
          cp .config $GITHUB_WORKSPACE/config.final
          cp System.map $GITHUB_WORKSPACE/System.map

      - name: Verify
        run: |
          cd $GITHUB_WORKSPACE
          python3 - <<'PY'
          data = open("Image","rb").read()
          print("size:", len(data), "magic@0x38:", data[0x38:0x3c].hex())
          v = data.find(b"Linux version ")
          print("version:", data[v:v+120].split(b"\x00")[0].decode("latin1", "replace"))
          PY
          grep -E " (devtmpfs|macvlan|ip6table_nat|nf_nat_ipv6|pids|user_namespace)" System.map | head -5 || true
          shasum -a 256 Image | tee Image.sha256

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-kernel-full
          path: |
            Image
            Image.sha256
            System.map
            config.final
            /tmp/build.log
            /tmp/olddef.log
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
