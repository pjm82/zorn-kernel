name: build-zorn-kernel-full3

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Xiaomi OSS branch
        required: false
        default: bsp-zorn-v-oss

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bc bison flex libssl-dev libelf-dev dwarves cpio rsync kmod xz-utils zstd lz4 python3 make gcc g++ clang-17 lld-17 llvm-17
          sudo ln -sf "$(command -v clang-17)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-17)" /usr/local/bin/clang++
          sudo ln -sf "$(command -v ld.lld-17)" /usr/local/bin/ld.lld
          for t in llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-as llvm-dis; do
            sudo ln -sf "$(command -v ${t}-17)" /usr/local/bin/${t}
          done
          clang --version | head -2
          ld.lld --version
          pahole --version

      - name: Fetch kernel source
        run: |
          BR="${{ github.event.inputs.branch }}"
          curl -fL --retry 5 -o kernel.tar.gz "https://codeload.github.com/MiCode/Xiaomi_Kernel_OpenSource/tar.gz/refs/heads/$BR"
          ls -lh kernel.tar.gz
          mkdir -p src
          tar -xzf kernel.tar.gz -C src --strip-components=1
          rm -f kernel.tar.gz
          head -5 src/Makefile
          du -sh src

      - name: Stub missing Kconfigs
        run: |
          cd src
          {
            echo "=== cwd: $(pwd) ==="
            echo "=== reference check ==="
            grep -n 'hwid' drivers/misc/Kconfig || echo "no hwid ref in drivers/misc/Kconfig"
            ls -d drivers/misc/hwid 2>/dev/null || echo "drivers/misc/hwid absent"
            echo "=== pre-create known stubs ==="
            mkdir -p drivers/misc/hwid
            [ -f drivers/misc/hwid/Kconfig ] || printf '# auto stub\n' > drivers/misc/hwid/Kconfig
            echo "=== sweep all Kconfig sources ==="
            python3 - <<'PY'
          import os, re, glob
          pat = re.compile(r'^\s*(source|osource|rsource)\s+"([^"]+)"', re.M)
          files = glob.glob("**/Kconfig", recursive=True)
          print("kconfig files:", len(files))
          stubs = []
          for f in files:
              try:
                  txt = open(f, encoding="utf-8", errors="replace").read()
              except Exception as e:
                  print("read fail", f, e)
                  continue
              base = os.path.dirname(f)
              for m in pat.finditer(txt):
                  t = m.group(2)
                  if "$" in t or "*" in t:
                      continue
                  tgt = os.path.normpath(os.path.join(base, t))
                  if not os.path.exists(tgt):
                      d = os.path.dirname(tgt)
                      if d:
                          os.makedirs(d, exist_ok=True)
                      open(tgt, "w").write("# auto stub: missing in Xiaomi OSS snapshot\n")
                      stubs.append(tgt)
          print("STUB COUNT:", len(stubs))
          for s in stubs:
              print("  stub:", s)
          PY
            echo "=== after ==="
            ls -l drivers/misc/hwid/Kconfig || echo "STUB STILL MISSING"
          } 2>&1 | tee /tmp/stubs.log

      - name: Configure
        run: |
          cd src
          cp $GITHUB_WORKSPACE/config/zorn-full.config .config
          cp .config /tmp/config.input
          make ARCH=arm64 LLVM=1 olddefconfig > /tmp/olddef.log 2>&1 || { tail -40 /tmp/olddef.log; exit 1; }
          echo "=== selected keys ==="
          for k in DEVTMPFS CGROUP_PIDS USER_NS SYSVIPC PID_NS MACVLAN IP6_NF_NAT IP6_NF_TARGET_MASQUERADE CFS_BANDWIDTH LOCALVERSION MODVERSIONS CFI_CLANG LTO_CLANG_THIN KASAN DEBUG_INFO_BTF MODULE_FORCE_LOAD WERROR MODULE_SIG; do
            grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" .config || echo "CONFIG_${k}: ABSENT"
          done
          python3 - <<'PY' 2>&1 | tee /tmp/dropped.log
          def load(p):
              d = {}
              for line in open(p, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if line.startswith("CONFIG_") or line.startswith("# CONFIG_"):
                      k = line.split("=")[0].replace("# ", "")
                      d[k] = line
              return d
          a = load("/tmp/config.input")
          b = load(".config")
          gone = [k for k in a if k not in b]
          print("CONFIG input:", len(a), "final:", len(b), "dropped:", len(gone))
          for k in sorted(gone):
              print("  dropped:", k, "was", a[k])
          PY

      - name: Relax module checks
        run: |
          python3 $GITHUB_WORKSPACE/patches/relax-module-checks.py $GITHUB_WORKSPACE/src 2>&1 | tee /tmp/patch.log

      - name: Build Image
        run: |
          cd $GITHUB_WORKSPACE/src
          set -o pipefail
          time make -j"$(nproc)" ARCH=arm64 LLVM=1 KCFLAGS=-Wno-error Image 2>&1 | tee /tmp/build.log | tail -40
          ls -lh arch/arm64/boot/Image
          cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image
          cp .config $GITHUB_WORKSPACE/config.final
          cp System.map $GITHUB_WORKSPACE/System.map

      - name: Verify
        run: |
          cd $GITHUB_WORKSPACE
          python3 - <<'PY'
          data = open("Image","rb").read()
          print("size:", len(data), "magic@0x38:", data[0x38:0x3c].hex())
          v = data.find(b"Linux version ")
          print("version:", data[v:v+140].split(b"\x00")[0].decode("latin1","replace"))
          PY
          grep -E " (devtmpfs_init|macvlan_link_register|user_namespace|init_user_ns|check_version|module_bug_finalize)" System.map | head -6 || true
          sha256sum Image | tee Image.sha256

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-kernel-full3
          path: |
            Image
            Image.sha256
            System.map
            config.final
            /tmp/build.log
            /tmp/olddef.log
            /tmp/stubs.log
            /tmp/dropped.log
            /tmp/patch.log
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
